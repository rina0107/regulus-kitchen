<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>regulus-kitchen | 練習ご飯＆買い出しボード</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      background: #fff8f3;
      color: #333;
      line-height: 1.6;
      padding-bottom: 60px;
    }
    header {
      background: linear-gradient(135deg, #ff7e36, #ff5722);
      color: #fff;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(255, 87, 34, 0.25);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: 0.5px; }
    .header-btns { display: flex; gap: 8px; }
    .btn-header {
      background: rgba(255,255,255,0.22);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.45);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
    }
    .container { max-width: 720px; margin: 20px auto; padding: 0 16px; }
    .flash {
      background: #fff3cd;
      border: 1px solid #ffeeba;
      color: #856404;
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-weight: bold;
      font-size: 0.9rem;
    }
    .admin-badge {
      display: inline-block;
      background: #ffe0ec;
      color: #c2185b;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      margin-bottom: 14px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
      border: 1px solid #f5e6dc;
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: #e65100;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .edit-mode-banner {
      background: #e3f2fd;
      border: 1.5px solid #90caf9;
      color: #0d47a1;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 14px;
      font-size: 0.9rem;
      font-weight: bold;
      display: none;
      justify-content: space-between;
      align-items: center;
    }
    .date-range-box {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: center;
      background: #fff5ed;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #ffd8be;
      margin-bottom: 16px;
    }
    .date-range-tilde {
      font-weight: bold;
      color: #ff5722;
      padding-top: 20px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: bold;
      color: #555;
      margin-bottom: 5px;
    }
    input[type="text"], input[type="date"], input[type="password"], textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #e0d6cf;
      border-radius: 10px;
      font-size: 0.95rem;
      background: #fff;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #ff7043;
    }
    .search-box-wrap {
      position: relative;
      margin: 6px 0 10px;
    }
    .search-input {
      padding: 9px 36px 9px 12px !important;
      background: #fffdf9 !important;
      border: 1.5px solid #ffcc80 !important;
      font-size: 0.9rem !important;
    }
    .search-clear-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: #eee;
      border: none;
      color: #666;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-size: 0.75rem;
      cursor: pointer;
      display: none;
    }
    .day-form-block {
      background: #fafafa;
      border: 1.5px solid #ece3dc;
      border-left: 5px solid #ff7043;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .day-form-header {
      font-weight: 800;
      color: #d84315;
      font-size: 1rem;
      margin-bottom: 10px;
    }
    .meal-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 8px;
    }
    .meal-row {
      background: #fff;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #eee;
    }
    .meal-row-inputs {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 8px;
      margin-top: 4px;
    }
    .shopper-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 6px 0 10px;
      max-height: 170px;
      overflow-y: auto;
      padding: 6px;
      background: #fffaf5;
      border-radius: 10px;
      border: 1px solid #f0e2d8;
    }
    .shopper-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fff;
      border: 1.5px solid #ffcc80;
      padding: 5px 11px;
      border-radius: 20px;
      font-size: 0.88rem;
      font-weight: bold;
      color: #d84315;
      cursor: pointer;
      user-select: none;
    }
    .shopper-chip:has(input:checked) {
      background: #ff7043;
      border-color: #f4511e;
      color: #fff;
    }
    .shopper-chip input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: #fff;
    }
    .member-form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
      align-items: end;
    }
    .member-list {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .member-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #faf8f6;
      border: 1px solid #ece3dc;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      gap: 8px;
    }
    @media (max-width: 540px) {
      .meal-row-inputs { grid-template-columns: 1fr; }
      .date-range-box { grid-template-columns: 1fr; }
      .date-range-tilde { display: none; }
      .member-form-grid { grid-template-columns: 1fr; }
    }
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #ff7043, #f4511e);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 12px;
      box-shadow: 0 4px 10px rgba(244, 81, 30, 0.3);
    }
    .btn-small {
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
    .section-heading {
      font-size: 1.15rem;
      font-weight: 800;
      color: #333;
      margin: 26px 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .camp-card {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
      border: 1.5px solid #ffd8be;
    }
    .camp-header {
      background: linear-gradient(135deg, #fff0e5, #ffe2ce);
      padding: 14px 18px;
      border-bottom: 1px solid #ffd0b0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .camp-period {
      font-size: 1.1rem;
      font-weight: 800;
      color: #d84315;
    }
    .camp-badge {
      background: #ff5722;
      color: #fff;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 3px 10px;
      border-radius: 20px;
    }
    .camp-body { padding: 16px 18px; }
    .day-timeline {
      position: relative;
      padding-left: 16px;
      border-left: 3px solid #ffab91;
      margin-bottom: 16px;
    }
    .day-timeline:last-of-type { margin-bottom: 10px; }
    .day-title-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }
    .day-date-label {
      font-weight: 800;
      font-size: 1rem;
      color: #333;
    }
    .event-tag {
      background: #fff3e0;
      color: #e65100;
      border: 1px solid #ffcc80;
      font-size: 0.8rem;
      font-weight: bold;
      padding: 2px 10px;
      border-radius: 20px;
    }
    .meal-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .meal-item {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      background: #faf8f6;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.93rem;
    }
    .meal-badge {
      font-weight: bold;
      font-size: 0.8rem;
      padding: 2px 8px;
      border-radius: 6px;
      min-width: 52px;
      text-align: center;
    }
    .badge-morning { background: #e3f2fd; color: #1565c0; }
    .badge-lunch { background: #fff8e1; color: #f57f17; }
    .badge-dinner { background: #ede7f6; color: #4527a0; }
    .recipe-link {
      display: inline-block;
      background: #ff7043;
      color: #fff;
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: bold;
      padding: 3px 9px;
      border-radius: 6px;
      margin-left: auto;
    }
    .btn-url-copy {
      background: #e0f2f1;
      color: #00695c;
      border: 1px solid #80cbc4;
      font-size: 0.78rem;
      font-weight: bold;
      padding: 3px 9px;
      border-radius: 6px;
      cursor: pointer;
    }
