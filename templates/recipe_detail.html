<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ dish_name }} のレシピ - regulus-kitchen</title>
    <style>
        body { font-family: sans-serif; margin: 20px; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { color: #333; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .section { margin-bottom: 20px; }
        .btn { display: inline-block; padding: 8px 16px; background-color: #007bff; color: white; text-decoration: none; border-radius: 4px; margin-top: 10px; }
        .btn-secondary { background-color: #6c757d; }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ dish_name }}</h1>

        {% if recipe %}
            <div class="section">
                <h2>材料</h2>
                <p>{{ recipe.ingredients | nl2br if recipe.ingredients else '記載なし' }}</p>
            </div>
            <div class="section">
                <h2>作り方</h2>
                <p>{{ recipe.instructions | nl2br if recipe.instructions else '記載なし' }}</p>
            </div>
        {% else %}
            <p>レシピ情報が見つかりませんでした。</p>
        {% endif %}

        <a href="/" class="btn btn-secondary">トップに戻る</a>
    </div>
</body>
</html>
